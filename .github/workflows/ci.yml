name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One Node version failing should not hide the others.
      fail-fast: false
      matrix:
        include:
          # The floor declared in `engines`, so the claim is tested, not assumed.
          - os: ubuntu-latest
            node: '20.11'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          # Development happens on Windows, and the package resolves paths and
          # spawns processes. Both are where the platforms disagree.
          - os: windows-latest
            node: '24'

    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Before typecheck: packages resolve each other's declarations from dist.
      - name: Build
        run: pnpm build

      # Both of these run `pnpm prisma:setup` first, which generates the Prisma
      # clients and fixture databases that are git-ignored.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  package:
    name: packed consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds, packs, installs the tarball into a temporary directory outside
      # the workspace, boots a real NestJS app against it and exercises the API.
      # This is the only check that can catch packaging faults - two of them
      # shipped past `build`, `typecheck` and the whole test suite before.
      - name: Verify packed package
        run: pnpm verify:package
